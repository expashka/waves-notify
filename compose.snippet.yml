# ─────────────────────────────────────────────────────────────
# waves-notify — блок сервиса для ВСТАВКИ в compose.yml твоего лендинга.
#
# 1. Скопируй этот репозиторий в проект как ./notify/
# 2. Вставь сервис `notify:` (ниже) в секцию services: своего проекта
# 3. Убедись, что у проекта есть общая сеть для веб-приложения и notify,
#    и что веб-приложение обращается к http://waves-notify:8080/lead
#
# Важно:
#   • PORT: 8080 задан явно, потому что общий .env проекта часто содержит
#     PORT (например 3000 у Next.js) — иначе waves-notify унаследует его
#     и поднимется не на том порту.
#   • Алиас `waves-notify` — это хост, по которому к нему обращается веб-приложение.
# ─────────────────────────────────────────────────────────────
services:
  notify:
    build:
      context: ./notify
    restart: unless-stopped
    env_file:
      - .env                # общий .env проекта (TG_BOT_TOKEN, TG_ADMIN_CHAT_ID, SITE_NAME, …)
    environment:
      PORT: 8080            # переопределяет PORT, унаследованный из общего .env
    volumes:
      - ./notify/data:/data
    networks:
      web:                  # замени на сеть, в которой находится твоё веб-приложение
        aliases:
          - waves-notify    # веб-приложение обращается к нему по http://waves-notify:8080
