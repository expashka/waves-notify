# Standalone-запуск — для локального теста waves-notify самого по себе.
# Для реального использования ВСТРАИВАЙ его в проект-лендинг (см. README → «Встраивание»).
#   docker compose -f compose.standalone.yml up -d --build
services:
  notify:
    build: .
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./data:/data
